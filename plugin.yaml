name: snap-action
version: 0.2.0
manifest_version: 2
description: >-
  Screenshot-to-action — send a booking, bill, ticket, shipment or promo
  screenshot and it is classified, filed to a persistent ledger, and turned
  into tappable actions: calendar entries (.ics + Google Calendar), exact-time
  reminders via Hermes cron, bill-split settle tracking, delivery follow-ups.
  Telegram inline keyboards with a zero-LLM fast path; text recall on
  desktop/CLI.
author: nishant
license: MIT
homepage: https://github.com/nini1294/snap-action
tags: [gateway, telegram, productivity, reminders, screenshots]
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: Bot token for Telegram inline keyboards (the same token the Telegram platform uses). Optional — /snaps text recall works without it.
    secret: true
capabilities:
  provides_tools:
    - snap_save
    - snap_list
    - snap_get
    - snap_update
    - snap_stats
    - snap_delete
    - snap_keyboard
provides_tools:
  - snap_save
  - snap_list
  - snap_get
  - snap_update
  - snap_stats
  - snap_delete
  - snap_keyboard
